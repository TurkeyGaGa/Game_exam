name: Validate Vex 3 Act 1 end to end
on:
  push:
    branches: [vex3-linux-check]
permissions:
  contents: read
jobs:
  browser-game-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        case: [reference, failure]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: docker/setup-docker-action@v5
        with:
          version: v29.5.2
          set-host: true
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - run: python -m pip install -e .
      - name: Run the reference solution
        if: matrix.case == 'reference'
        run: |
          harbor run --game-suite vex3 --standard -c configs/harbor/oracle.json \
            --jobs-dir "$PWD/jobs" --job-name browser-reference -y
          python ci_checks/check-browser-game-result.py jobs/browser-reference 1
      - name: Run the failure control
        if: matrix.case == 'failure'
        run: |
          python game_first_exam/tests/benchmarks/vex3/missed_jump/run_harbor.py
          python ci_checks/check-browser-game-result.py jobs 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vex3-${{ matrix.case }}-evidence
          path: |
            jobs/*/result.json
            jobs/*/*/artifacts/data/final.json
            jobs/*/*/verifier/reward.json
            jobs/*/*/trial.log
          retention-days: 7

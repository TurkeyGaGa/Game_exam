name: Verify PR game entry jobs
on:
  push:
    branches: [game-linux-compat-check]
permissions:
  contents: read
jobs:
  browser-game-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: firewater, control: firewater/missed_jump, revision: fb92c63f0353dd5dc4e6363393e179f29eb292bd}
          - {suite: rocketleague, control: rocketleague/concede, revision: f48b994bdaabb3b06548fc358f18490ad6d4a646}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: docker/setup-docker-action@v5
        with:
          version: v29.5.2
          set-host: true
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - run: python -m pip install -e .
      - name: Run the reference solution
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          harbor run --game-suite "$SUITE" --standard -c configs/harbor/oracle.json \
            --jobs-dir "$PWD/jobs" --job-name browser-reference -y
          python ci_checks/check-browser-game-result.py jobs/browser-reference 1
      - name: Run the failure control
        env:
          CONTROL: ${{ matrix.control }}
        run: |
          python "game_first_exam/tests/benchmarks/$CONTROL/run_harbor.py"
          python ci_checks/check-browser-game-result.py jobs 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.suite }}-smoke-evidence
          path: |
            jobs/*/result.json
            jobs/*/*/artifacts/data/final.json
            jobs/*/*/verifier/reward.json
            jobs/*/*/trial.log
          retention-days: 7
